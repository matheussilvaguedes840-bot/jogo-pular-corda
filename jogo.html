<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Jogo - Pular Corda</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:Arial;
    background:linear-gradient(#87CEEB,#ffffff);
}

canvas{
    background:#f0f0f0;
    display:block;
    margin:0 auto;
    border:3px solid black;
}

#btnPular{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:20px;
    font-size:20px;
    border:none;
    border-radius:50%;
    background:#ff5722;
    color:white;
}

#startScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
</style>
</head>
<body>

<div id="startScreen">
    <h1>🪢 SUPER PULAR CORDA</h1>
    <p>Aperte ESPAÇO ou toque em PULAR</p>
    <button onclick="startGame()">JOGAR</button>
</div>

<canvas id="gameCanvas" width="600" height="300"></canvas>
<button id="btnPular">PULAR</button>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let player, ropeAngle, score, recorde, gameOver, started;

function resetGame(){
    player = {
        x: 150,
        y: 200,
        width: 40,
        height: 60,
        velocityY: 0,
        jumping:false
    };

    ropeAngle = 0;
    score = 0;
    recorde = localStorage.getItem("recorde") || 0;
    gameOver = false;
    started = true;
}

function startGame(){
    document.getElementById("startScreen").style.display="none";
    resetGame();
    update();
}

function jump(){
    if(!player.jumping && !gameOver){
        player.velocityY = -13;
        player.jumping = true;
        playJumpSound();
    }
}

document.addEventListener("keydown",(e)=>{
    if(e.code==="Space") jump();
    if(gameOver && e.code==="Enter"){
        resetGame();
    }
});

document.getElementById("btnPular").addEventListener("click",jump);

function drawPlayer(){
    // Corpo
    ctx.fillStyle="blue";
    ctx.fillRect(player.x,player.y,player.width,player.height);

    // Cabeça
    ctx.fillStyle="peachpuff";
    ctx.beginPath();
    ctx.arc(player.x+20,player.y-15,15,0,Math.PI*2);
    ctx.fill();

    // Olhos
    ctx.fillStyle="black";
    ctx.fillRect(player.x+15,player.y-20,3,3);
    ctx.fillRect(player.x+22,player.y-20,3,3);
}

function drawRope(){
    ctx.strokeStyle="red";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.arc(player.x+20, 250, 80, ropeAngle, ropeAngle+Math.PI);
    ctx.stroke();
}

function playJumpSound(){
    let audio = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
    audio.play();
}

function playLoseSound(){
    let audio = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
    audio.play();
}

function update(){
    if(!started) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Gravidade
    player.velocityY += 0.6;
    player.y += player.velocityY;

    if(player.y >= 200){
        player.y = 200;
        player.jumping=false;
    }

    // Girar corda
    ropeAngle += 0.08;

    // Verificar colisão
    if(ropeAngle > Math.PI-0.2 && ropeAngle < Math.PI+0.2){
        if(!player.jumping){
            gameOver=true;
            playLoseSound();
        }else{
            score++;
            if(score > recorde){
                recorde = score;
                localStorage.setItem("recorde",recorde);
            }
        }
    }

    drawPlayer();
    drawRope();

    ctx.fillStyle="black";
    ctx.font="20px Arial";
    ctx.fillText("Pontos: "+score,20,30);
    ctx.fillText("Recorde: "+recorde,20,60);

    if(gameOver){
        ctx.fillStyle="red";
        ctx.font="30px Arial";
        ctx.fillText("GAME OVER",200,150);
        ctx.font="20px Arial";
        ctx.fillText("Pressione ENTER",220,180);
        return;
    }

    requestAnimationFrame(update);
}
</script>

</body>
</html>
